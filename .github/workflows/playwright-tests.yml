name: Playwright Java Tests

on:
  push:
    branches: [ main, branchOne ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Blocking: compile everything. Catches real code/compilation errors.
      - name: Compile (blocking)
        run: mvn -B test-compile

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium" -D exec.classpathScope=test

      # Non-blocking: these E2E tests hit the live Rediff site, which GitHub's
      # cloud runners often cannot reach. Failures here are informational and do
      # NOT fail the build. Run them locally or on a self-hosted runner for real
      # pass/fail signal.
      - name: Run E2E tests (non-blocking)
        continue-on-error: true
        run: mvn -B test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
